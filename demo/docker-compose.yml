version: '3.9'

services:
  biblioteca_app:
    image: biblioteca
    ports:
      - "8080:8080"
    networks:
      - biblioteca_net
    volumes:
      - pg_tendencia_data:/app/data
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  biblioteca_db:
    image: postgres:latest
    environment:
      POSTGRES_USER: biblioteca_admin
      POSTGRES_PASSWORD: biblioteca_pass
      POSTGRES_DB: biblioteca
    ports:
      - "5432:5432"
    networks:
      - biblioteca_net
    volumes:
      - db_data:/var/lib/postgresql/data
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

networks:
  biblioteca_net:
    driver: bridge

volumes:
  pg_tendencia_data:
  db_data:
