# Perfil de producción
spring.profiles.active=production

# Configuración de la aplicación
spring.application.name=lyxabook

# Configuración de PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/java
spring.datasource.username=postgres
spring.datasource.password=12345
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate 
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Configuración para subida de archivos
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=/app/uploads

# Configuraciones JWT
jwt.secret=esDY51cgt9a2#3gYn*7xPrQmK$fW@Lz8
jwt.expiration=86400000

# Logging
logging.level.root=INFO
logging.level.com.example.demo=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web.filter=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Configuraciones de seguridad y rendimiento
spring.main.banner-mode=off
server.tomcat.max-threads=200
server.tomcat.min-spare-threads=20
server.port=8080

# Seguridad de cookies
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true

# Compresión
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain,text/css,text/javascript,application/javascript
server.compression.min-response-size=2048